<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AlfaazAI Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; text-align: center; color: #222; }
  h1 { color: #1a5276; }
  button { padding: 14px 28px; font-size: 16px; border-radius: 30px; border: none; cursor: pointer; margin: 10px; }
  #recordBtn { background: #1a5276; color: white; }
  #recordBtn.recording { background: #c0392b; }
  select { padding: 8px; margin: 10px; border-radius: 6px; }
  #result { margin-top: 30px; text-align: left; background: #f4f6f7; padding: 16px; border-radius: 10px; min-height: 60px; }
  audio { width: 100%; margin-top: 10px; }
  #status { color: #888; font-size: 14px; }
</style>
</head>
<body>
  <h1>🗣️ AlfaazAI</h1>
  <p>Speak in your language. Get it translated back, spoken aloud.</p>

  <label>I'm speaking:
    <select id="sourceLang">
      <option value="ur">Urdu</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="ar">Arabic</option>
    </select>
  </label>
  <label>Translate to:
    <select id="targetLang">
      <option value="en">English</option>
      <option value="ur">Urdu</option>
      <option value="hi">Hindi</option>
      <option value="ar">Arabic</option>
    </select>
  </label>
  <br/>
  <button id="recordBtn">🎙️ Start Speaking</button>
  <div id="status"></div>

  <div id="result">Your transcription and translation will appear here.</div>

  <script>
    const API_BASE = "http://localhost:8000";
    const recordBtn = document.getElementById("recordBtn");
    const resultDiv = document.getElementById("result");
    const statusDiv = document.getElementById("status");

    let audioContext, mediaStream, processor, input, recording = false;
    let sampleRate = 44100;
    let recordedSamples = [];

    recordBtn.onclick = async () => {
      if (!recording) {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        sampleRate = audioContext.sampleRate;
        input = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        recordedSamples = [];

        processor.onaudioprocess = (e) => {
          const channelData = e.inputBuffer.getChannelData(0);
          recordedSamples.push(new Float32Array(channelData));
        };

        input.connect(processor);
        processor.connect(audioContext.destination);

        recordBtn.textContent = "⏹️ Stop";
        recordBtn.classList.add("recording");
        statusDiv.textContent = "Listening...";
        recording = true;
      } else {
        processor.disconnect();
        input.disconnect();
        mediaStream.getTracks().forEach(t => t.stop());
        recordBtn.textContent = "🎙️ Start Speaking";
        recordBtn.classList.remove("recording");
        recording = false;
        statusDiv.textContent = "";
        sendAudio();
      }
    };

    function encodeWAV(samples, sampleRate) {
      // Merge all recorded chunks into one Float32Array
      let length = samples.reduce((sum, arr) => sum + arr.length, 0);
      let merged = new Float32Array(length);
      let offset = 0;
      for (const chunk of samples) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }

      // Convert Float32 [-1,1] to Int16 PCM
      let pcm = new Int16Array(merged.length);
      for (let i = 0; i < merged.length; i++) {
        let s = Math.max(-1, Math.min(1, merged[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      // Build WAV file header + data
      const buffer = new ArrayBuffer(44 + pcm.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + pcm.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);       // PCM format
      view.setUint16(22, 1, true);       // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);      // 16-bit
      writeString(36, "data");
      view.setUint32(40, pcm.length * 2, true);

      let offset2 = 44;
      for (let i = 0; i < pcm.length; i++, offset2 += 2) {
        view.setInt16(offset2, pcm[i], true);
      }

      return new Blob([view], { type: "audio/wav" });
    }

    async function sendAudio() {
      resultDiv.textContent = "Processing...";
      const wavBlob = encodeWAV(recordedSamples, sampleRate);

      const formData = new FormData();
      formData.append("audio", wavBlob, "speech.wav");
      formData.append("source_lang", document.getElementById("sourceLang").value);
      formData.append("target_lang", document.getElementById("targetLang").value);

      try {
        const res = await fetch(`${API_BASE}/process`, { method: "POST", body: formData });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Request failed");
        }
        const data = await res.json();
        resultDiv.innerHTML = `
          <b>You said:</b> ${data.original_text}<br/>
          <b>Translated:</b> ${data.translated_text}<br/>
          <audio controls autoplay src="${API_BASE}${data.audio_url}"></audio>
        `;
      } catch (err) {
        resultDiv.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
